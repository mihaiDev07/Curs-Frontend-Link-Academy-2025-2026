<!DOCTYPE html>
<html lang="ro">

<head>
    <meta charset="UTF-8">
    <title>Editare utilizator</title>

</head>

<body>

    <nav>
        <a href="index.html">Utilizatori</a>
        <a href="add.html">Adauga utilizator</a>

    <div class="container">

        <h1>Editare utilizator</h1>

        <form id="editForm">

            <button type="submit">Actualizeaza</button>

        </form>

    </div>
