<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Curs 3 - Hello Vue</title>
</head>

<body>

  {{ 5 + 9}}
  {{ message }} {{ nume }}
  <div id="app">
    <div>
      {{ message }} {{ nume }}
      {{ 4 + 5}}
      {{salut ? salut : 'Buna ziua!'}}
      {{salut || 'Buna ziua22!'}}
      <ol type="i">
        <li v-for="car in cars">{{ car }}</li>
      </ol>

      <p>{{ count }}</p>
      <button @click="increment(1)">Apasa1 +</button>
      <button @click="increment(-1)">Apasa2 +</button>
      <button @click="decrementare">Apasa3 -</button>
    </div>
  </div>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script>
    const { createApp } = Vue;

    let app = createApp({
      data() {
        return {
          message: 'Hello Vue!',
          nume: 'Adrian',
          //salut: 'Bine ati venit!',
          count: 0,
          cars: [
            'Tesla',
            'Toyota',
            'BMW',
            'Honda',
            'Ford',
            'Hyundai',
            'Nissan',
            'Porsche'
          ]
        }
      },

      methods: {
        increment(amount = 1) {
          this.count += amount;
        },
        decrementare() {
          this.count--;
        }
      }
    }).mount('#app');



    // Aplicația Vue este un obiect care controlează elementul cu id-ul #app
    // Toate elementele controlat de Aplicația Vue sunt reactive, adica:
    // Data Binding (este legat de proprietatea message a aplicației și se
    // schimbă când se schimbă acea proprietate)

    // concret deschidem consola si tastam: app.message='Buna ziua!' Apasam Enter
  </script>
</body>

</html>
